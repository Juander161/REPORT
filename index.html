<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Report Hub</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://*.sharepoint.com; worker-src 'self'; manifest-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="description" content="Centro de reportes semanales: dashboards TASSEL ONLY, GOWNS y HOMESHIP con comparativo entre temporadas y exportación a Excel.">
<meta name="theme-color" content="#0f2340">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Report Hub">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
<script>
  /* aplica el tema guardado antes de pintar para evitar parpadeos */
  try { var t = JSON.parse(localStorage.getItem('rh-tema') || '"auto"'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Menú principal">
    <a class="brand" href="#/panorama" aria-label="Report Hub · inicio">
      <svg class="brand-logo" viewBox="0 0 48 48" aria-hidden="true">
        <rect width="48" height="48" rx="12" fill="#17335c"/>
        <rect x="11" y="26" width="6" height="12" rx="2" fill="#7f93b0"/>
        <rect x="21" y="19" width="6" height="19" rx="2" fill="#86b6ef"/>
        <rect x="31" y="12" width="6" height="26" rx="2" fill="#ffffff"/>
        <path d="M34 12 l4 -3" stroke="#c9a227" stroke-width="2" stroke-linecap="round"/>
        <circle cx="39" cy="8.5" r="2.2" fill="#c9a227"/>
      </svg>
      <span><span class="brand-n">Report Hub</span><br><span class="brand-s">Centro de reportes</span></span>
    </a>
    <nav id="nav"></nav>
    <div class="side-foot">
      <button class="btn-install" id="btnInstalar" type="button" hidden>⤓ Instalar app</button>
      <div class="theme-sw" role="group" aria-label="Tema de color">
        <button type="button" data-tema="auto" title="Según el sistema">Auto</button>
        <button type="button" data-tema="light" title="Claro">Claro</button>
        <button type="button" data-tema="dark" title="Oscuro">Oscuro</button>
      </div>
      <div class="side-ver"><span id="appVer"></span> · funciona sin conexión</div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="btnMenu" type="button" aria-label="Abrir menú">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <span class="crumb" id="crumb"></span>
      <span class="spacer"></span>
      <span class="chip-top off" id="chipRed" hidden>Sin conexión</span>
      <a class="chip-top" id="chipExcel" href="#/datos" hidden></a>
    </header>
    <div id="banners" aria-live="polite"></div>
    <main id="views"></main>
    <section id="frames" hidden></section>
  </div>
</div>
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>

<script src="vendor/chart.umd.min.js"></script>
<script src="js/core/util.js"></script>
<script src="js/core/store.js"></script>
<script src="js/core/zip.js"></script>
<script src="js/core/xlsx.js"></script>
<script src="js/registry.js"></script>
<script src="js/core/model.js"></script>
<script src="js/core/tablas.js"></script>
<script src="js/core/proyeccion.js"></script>
<script src="js/core/dbexcel.js"></script>
<script src="js/core/demo.js"></script>
<script src="js/ui/info.js"></script>
<script src="js/ui/charts.js"></script>
<script src="js/ui/dashboard.js"></script>
<script src="js/ui/proyeccion.js"></script>
<script src="js/ui/panorama.js"></script>
<script src="js/ui/datos.js"></script>
<script src="js/ui/ayuda.js"></script>
<script src="js/app.js"></script>
</body>
</html>
